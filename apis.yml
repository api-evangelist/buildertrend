aid: buildertrend
name: Buildertrend
description: >-
  Buildertrend is an Omaha, Nebraska-based cloud construction-management
  platform serving residential home builders, remodelers, and specialty trade
  contractors. The product consolidates sales (CRM, leads, proposals,
  contracts, email marketing), project management (schedule, daily logs,
  selections, change orders, warranties, sub portal, client updates), and
  financial management (estimates, bids, takeoff, job-costing budgets, bills,
  purchase orders, invoices, online payments) into a single web and mobile
  application used by 20,000+ builders. Pricing is custom-quoted by sales
  rather than published self-serve tiers, with unlimited users and projects on
  every plan, and the platform integrates with QuickBooks, Xero, and other
  accounting and trade tools through a partner integrations marketplace. The
  company exposes a REST API at api.buildertrend.com that is gated by partner
  agreement — endpoints return 401 Unauthorized to the public and there is no
  open developer portal, public OpenAPI specification, or self-serve API key
  signup. As a result Buildertrend is profiled here as a non-public
  (partner-only) API provider; the public surface documented is limited to
  marketing, support, integrations marketplace, mobile apps, and corporate
  resources.
